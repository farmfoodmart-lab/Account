<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../src/assets/app-icon.svg">
  <link rel="apple-touch-icon" href="../../src/assets/app-icon.svg">
  <title>ผังบัญชี · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../src/styles/main.css">
  <link rel="modulepreload" href="../../src/core/store.js">
  <script src="../../src/components/theme.js"></script>
</head>
<body>
  <script src="../../src/components/app-shell.js"></script>
  <script src="../../src/components/date-input.js" defer></script>
  <main id="main">
    <div class="page-head">
      <div><h2>ผังบัญชี</h2><p class="page-sub">กำหนดรหัสและหมวดบัญชี หมวดบัญชีเป็นตัวกำหนดด้านปกติ (เดบิต/เครดิต) และตำแหน่งในงบการเงิน</p></div>
      <div class="page-actions"><button type="button" id="account-template" class="secondary">เพิ่มผังบัญชีมาตรฐาน</button><button type="button" id="account-export" class="secondary">ส่งออก CSV</button></div>
    </div>
    <form id="account-form" class="card" autocomplete="off">
      <div class="form-title"><h3 id="account-form-title">เพิ่มบัญชีใหม่</h3><span class="badge warning form-mode">กำลังแก้ไข</span></div>
      <div class="form-grid">
        <label class="field"><span class="req">หมวดบัญชี</span><select id="account-type" required>
          <option value="">-- เลือกหมวด --</option>
          <option value="asset">สินทรัพย์ (Asset)</option>
          <option value="liability">หนี้สิน (Liability)</option>
          <option value="equity">ส่วนของเจ้าของ (Equity)</option>
          <option value="revenue">รายได้ (Revenue)</option>
          <option value="expense">ค่าใช้จ่าย (Expense)</option>
        </select></label>
        <label class="field"><span class="req">รหัสบัญชี</span><input type="text" id="account-code" placeholder="เช่น 1101" required></label>
        <label class="field span-2"><span class="req">ชื่อบัญชี</span><input type="text" id="account-name" placeholder="เช่น เงินสด" required></label>
      </div>
      <p class="muted" id="account-type-hint" style="margin-top:10px"></p>
      <div class="form-actions"><button type="button" id="account-cancel" class="secondary" hidden>ยกเลิก</button><button type="submit" id="account-submit">เพิ่มบัญชี</button></div>
    </form>
    <div class="filter-bar">
      <div class="chips" id="account-type-chips"></div>
      <label class="grow" style="margin-left:auto;max-width:320px">ค้นหา <input type="search" id="account-search" placeholder="รหัส / ชื่อบัญชี"></label>
    </div>
    <div class="table-wrap">
      <table id="accounts-table">
        <thead><tr><th class="col-code">รหัส</th><th>ชื่อบัญชี</th><th>หมวด</th><th>ด้านปกติ</th><th class="right">รายการ</th><th class="right col-amount">ยอดคงเหลือ</th><th class="col-actions"></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="accounts.js"></script>
</body>
</html>
