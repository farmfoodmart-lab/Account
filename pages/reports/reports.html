<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../src/assets/app-icon.svg">
  <link rel="apple-touch-icon" href="../../src/assets/app-icon.svg">
  <title>งบการเงิน · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../src/styles/main.css">
  <link rel="modulepreload" href="../../src/core/store.js">
  <script src="../../src/components/theme.js"></script>
</head>
<body>
  <script src="../../src/components/app-shell.js"></script>
  <script src="../../src/components/date-input.js" defer></script>
  <main id="main">
    <div class="page-head">
      <div><h2>งบการเงิน</h2><p class="page-sub">งบกำไรขาดทุนสำหรับงวดที่เลือก และงบแสดงฐานะการเงิน ณ วันสิ้นงวด</p></div>
      <div class="page-actions"><button type="button" id="report-export" class="secondary">ส่งออก CSV</button><button type="button" class="secondary" onclick="window.print()">พิมพ์</button></div>
    </div>
    <div class="filter-bar">
      <div class="chips" id="report-presets" style="flex-basis:100%">
        <button type="button" class="chip" data-preset="month">เดือนนี้</button>
        <button type="button" class="chip" data-preset="last-month">เดือนก่อน</button>
        <button type="button" class="chip" data-preset="quarter">ไตรมาสนี้</button>
        <button type="button" class="chip" data-preset="year">ปีนี้</button>
        <button type="button" class="chip" data-preset="period">งวดบัญชี</button>
        <button type="button" class="chip" data-preset="all">ทั้งหมด</button>
      </div>
      <label>ตั้งแต่ <input type="date" id="report-start-date"></label>
      <label>ถึง <input type="date" id="report-end-date"></label>
      <button type="button" id="report-apply-filter">แสดงรายงาน</button>
      <button type="button" id="report-clear-filter" class="ghost">ทั้งหมด</button>
    </div>
    <div id="reports-view"><div class="skeleton"></div></div>
  </main>
  <script type="module" src="reports.js"></script>
</body>
</html>
