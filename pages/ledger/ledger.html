<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บัญชีแยกประเภท · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../style.css">
  <link rel="modulepreload" href="../../js/data.js">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <script src="../../js/shell.js"></script>
  <main id="main">
    <div class="page-head">
      <div><h2>บัญชีแยกประเภท</h2><p class="page-sub">ความเคลื่อนไหวและยอดคงเหลือสะสมของแต่ละบัญชี คลิกที่บัญชีเพื่อดูรายละเอียด</p></div>
      <div class="page-actions"><button type="button" id="ledger-toggle-all" class="secondary">ขยายทั้งหมด</button><button type="button" id="ledger-export" class="secondary">ส่งออก CSV</button><button type="button" class="secondary" onclick="window.print()">พิมพ์</button></div>
    </div>
    <div class="filter-bar">
      <label>หมวดบัญชี <select id="ledger-type"></select></label>
      <label style="min-width:220px">บัญชี <select id="ledger-account"></select></label>
      <label>ตั้งแต่ <input type="date" id="ledger-from"></label>
      <label>ถึง <input type="date" id="ledger-to"></label>
      <label class="grow">ค้นหารายการ <input type="search" id="ledger-search" placeholder="คำอธิบาย / เลขที่เอกสาร"></label>
      <label class="check"><input type="checkbox" id="ledger-hide-empty" checked> ซ่อนบัญชีที่ไม่มีความเคลื่อนไหว</label>
    </div>
    <div id="ledger-summary"></div>
    <div id="ledger-view"><div class="skeleton"></div></div>
  </main>
  <script type="module" src="ledger.js"></script>
</body>
</html>
