<!DOCTYPE html>
<html lang="th">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div class="page-head">
      <div><h2>รายงานภาษีซื้อ-ภาษีขาย</h2><p class="page-sub">สรุปภาษีมูลค่าเพิ่มรายเดือนจากบัญชีภาษีขาย/ภาษีซื้อ และรายละเอียดเอกสารสำหรับยื่น ภ.พ.30</p></div>
