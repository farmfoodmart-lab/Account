<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กระดาษทำการ · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../style.css">
  <link rel="modulepreload" href="../../js/data.js">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <script src="../../js/shell.js"></script>
  <main id="main">
    <div class="page-head">
      <div><h2>กระดาษทำการ</h2><p class="page-sub">งบทดลอง → รายการปรับปรุง → งบทดลองหลังปรับปรุง → งบกำไรขาดทุน และงบแสดงฐานะการเงิน</p></div>
      <div class="page-actions"><button type="button" id="worksheet-export" class="secondary">ส่งออก CSV</button><button type="button" class="secondary" onclick="window.print()">พิมพ์</button></div>
    </div>
    <div class="filter-bar">
      <label>ณ วันที่ <input type="date" id="worksheet-to"></label>
      <p class="muted" style="flex:1;min-width:240px">ช่อง “ปรับปรุง” ดึงจากรายการที่บันทึกเป็นประเภท <strong>รายการปรับปรุง</strong> ในสมุดรายวัน · รายการปิดบัญชีจะไม่ถูกนำมาแสดง</p>
    </div>
    <div id="worksheet-view"><div class="skeleton"></div></div>
  </main>
  <script type="module" src="worksheet.js"></script>
</body>
</html>
