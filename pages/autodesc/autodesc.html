<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำอธิบายอัตโนมัติ · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../style.css">
  <link rel="modulepreload" href="../../js/data.js">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <script src="../../js/shell.js"></script>
  <main id="main">
    <div class="page-head">
      <div><h2>คำอธิบายอัตโนมัติ</h2><p class="page-sub">แม่แบบรายการตามลูกค้า เมื่อเลือกลูกค้าในสมุดรายวัน ระบบจะเติมคำอธิบาย บัญชีเดบิต และบัญชีเครดิตให้ทันที</p></div>
    </div>
    <form id="auto-description-form" class="card" autocomplete="off">
      <div class="form-title"><h3>เพิ่ม / แก้ไขแม่แบบ</h3></div>
      <div class="form-grid">
        <label class="field"><span class="req">ลูกค้า</span><select id="auto-description-customer" required></select></label>
        <label class="field"><span class="req">บัญชีเดบิต (Dr.)</span><select id="auto-description-debit-account" required></select></label>
        <label class="field"><span class="req">บัญชีเครดิต (Cr.)</span><select id="auto-description-credit-account" required></select></label>
        <label class="field span-all"><span class="req">คำอธิบาย</span><input type="text" id="auto-description-text" placeholder="เช่น รับชำระค่าสินค้าจากลูกค้า" required></label>
      </div>
      <div class="form-actions"><button type="button" id="auto-description-cancel" class="secondary" hidden>ยกเลิก</button><button type="submit" id="auto-description-submit">เพิ่มคำอธิบาย</button></div>
    </form>
    <div class="section-head"><h3>แม่แบบทั้งหมด <span id="autodesc-count" class="muted"></span></h3><label class="search-input" style="min-width:min(280px,100%)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="autodesc-search" placeholder="ค้นหาแม่แบบ" aria-label="ค้นหาแม่แบบ" data-table-filter="#auto-description-table" data-filter-count="#autodesc-count"></label></div>
    <div class="table-wrap"><table id="auto-description-table"><thead><tr><th>ลูกค้า</th><th>บัญชีเดบิต</th><th>บัญชีเครดิต</th><th>คำอธิบาย</th><th class="col-act"></th></tr></thead><tbody></tbody></table></div>
  </main>
  <script type="module" src="autodesc.js"></script>
</body>
</html>
