<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · ระบบบัญชีคู่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../src/styles/main.css">
  <link rel="modulepreload" href="../../src/core/store.js">
  <script src="../../src/components/theme.js"></script>
</head>
<body class="auth-page">
  <main id="main">
    <div class="login-card card">
      <div class="brand" style="margin-bottom:18px"><span class="brand-mark">฿</span><span class="brand-text"><strong>ระบบบัญชีคู่</strong><small>Double-entry Accounting</small></span></div>
      <h2 id="login-title">เข้าสู่ระบบ</h2>
      <p class="page-sub" id="login-sub">ใช้อีเมลหรือชื่อผู้ใช้ และรหัสผ่านที่ลงทะเบียนไว้</p>
      <button type="button" id="login-google" class="secondary google-button" style="margin-top:18px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.2 1.6l3.1-3.1A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>เข้าสู่ระบบด้วย Google</button>
      <div class="login-divider"><span>หรือ</span></div>
      <form id="login-form" class="stack" autocomplete="on">
        <label class="field"><span>อีเมลหรือชื่อผู้ใช้</span><input type="text" id="login-email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="name@example.com หรือ admin" required></label>
        <label class="field"><span>รหัสผ่าน</span><input type="password" id="login-password" autocomplete="current-password" minlength="6" required></label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit" id="login-submit">เข้าสู่ระบบ</button>
      </form>
      <div class="login-links"><button type="button" class="link-button" id="login-toggle">ยังไม่มีบัญชี? สร้างบัญชีผู้ใช้</button><button type="button" class="link-button" id="login-reset">ลืมรหัสผ่าน</button></div>
      <div id="login-help" class="banner warn" hidden style="margin-top:16px"></div>
    </div>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
