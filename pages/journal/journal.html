<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกรายการ · ระบบบัญชีคู่</title><link rel="stylesheet" href="../../assets/tailwind.css">
  <link rel="stylesheet" href="journal.css">
</head>
<body class="min-h-screen animate-page-enter">
  <header class="relative z-10 shadow-sm">
    <h1>ระบบบัญชีคู่</h1><button type="button" id="theme-toggle" class="theme-toggle transition-all duration-200 hover:scale-105 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 motion-reduce:transition-none motion-reduce:hover:scale-100" aria-pressed="false"><span id="theme-toggle-icon" aria-hidden="true">☾</span><span id="theme-toggle-label">โหมดมืด</span></button>
    <nav id="main-nav" class="flex flex-wrap gap-1" aria-label="เมนูหลัก">
      <a href="../dashboard/dashboard.html">แดชบอร์ด</a>
      <a href="../settings/settings.html">ตั้งค่า</a>
      <a href="../import/import.html">นำเข้า Excel</a>
      <a href="../customers/customers.html">รายชื่อลูกค้า</a>
      <a href="../customer-costs/customer-costs.html">ต้นทุน/ขายลูกค้า</a>
      <a href="../incoming-docs/incoming-docs.html">เอกสารรับเข้า</a>
      <a href="../autodesc/autodesc.html">คำอธิบายอัตโนมัติ</a>
      <a href="../accounts/accounts.html">หมวดหมู่บัญชี</a>
      <a href="../receivables/receivables.html">ลูกหนี้</a>
      <a href="../journal/journal.html" class="active" aria-current="page">บันทึกรายการ</a>
      <a href="../ledger/ledger.html">บัญชีแยกประเภท</a>
      <a href="../trial/trial.html">งบทดลอง</a>
      <a href="../worksheet/worksheet.html">กระดาษทำการ</a>
      <a href="../reports/reports.html">รายงานการเงิน</a>
    </nav>
  </header>
  <main class="mx-auto w-full max-w-7xl px-4 py-8">
    <h2 class="mb-6 text-2xl font-bold tracking-tight">บันทึกรายการ (Journal Entry)</h2>
    <form id="journal-entry-form" class="card">
      <div class="row"><label>วันที่ <input type="date" id="journal-entry-date" required></label><label>ลูกค้า <select id="journal-entry-customer"></select></label><label>คำอธิบาย <input type="text" id="journal-entry-description" placeholder="รายละเอียดรายการ" required></label></div>
      <div id="journal-entry-lines"></div>
      <div class="row actions"><button type="button" id="add-line" class="secondary">+ เพิ่มบรรทัด</button>
        <div class="totals">เดบิต: <span id="total-debit">0.00</span> | เครดิต: <span id="total-credit">0.00</span></div>
        <button type="submit" id="journal-entry-submit">บันทึก</button><button type="button" id="journal-entry-cancel" class="secondary" hidden>ยกเลิก</button>
      </div><p id="journal-entry-error" class="error"></p>
    </form>
    <div class="journal-saved"><div class="section-head"><h3>รายการที่บันทึกแล้ว</h3><button type="button" id="journal-entry-export" class="small secondary">ส่งออก CSV</button></div>
      <div class="filter-bar card"><label>ตั้งแต่ <input type="date" id="journal-entry-filter-start-date"></label><label>ถึง <input type="date" id="journal-entry-filter-end-date"></label>
        <label class="grow">ค้นหา <input type="search" id="journal-entry-filter-text" placeholder="คำอธิบาย / ลูกค้า / ชื่อบัญชี"></label><button type="button" id="journal-entry-filter-clear" class="secondary small">ล้างตัวกรอง</button>
      </div><p id="je-filter-summary" class="muted"></p><div id="journal-list"></div>
    </div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div><footer><span id="status" class="note">กำลังเชื่อมต่อ Firebase...</span></footer>
  <script src="../../js/theme.js"></script><script type="module" src="journal.js"></script>
</body>
</html>
